[package]
name = "quicksearch"
version = "0.1.0"
description = "Whole-drive file and content search for Windows, on a global hotkey."
authors = ["Etienne de Lange"]
license = "MIT"
repository = "https://github.com/etiennedelange/quicksearch"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
