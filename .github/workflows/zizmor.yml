name: Workflow security

# zizmor checks the workflows and dependabot.yml for unpinned actions, template injection,
# over-broad permissions and leaked credentials. Any finding fails the job; accepted ones carry
# a `# zizmor: ignore[...]` comment saying why.
on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # advanced-security: false prints findings in the log and as PR annotations instead of
      # uploading them to code scanning. Both zizmor versions are pinned; Dependabot bumps the action.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
