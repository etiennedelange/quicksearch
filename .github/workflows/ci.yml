name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Several index tests walk real directories with `rg --files`.
      - name: Install ripgrep
        run: choco install ripgrep --no-progress -y

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings -A clippy::type_complexity

      - name: Rust tests
        run: cargo test --locked

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Frontend tests
        working-directory: .
        run: node --test scripts/frontend-settings.test.cjs
